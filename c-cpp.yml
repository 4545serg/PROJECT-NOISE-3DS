name: Build PROJECT NOISE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Nintendo 3DS application
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            sh -c "make deps && make"

      - name: Upload 3DSX build
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-NOISE-3DSX
          path: |
            project_noise.3dsx
            project_noise.smdh
